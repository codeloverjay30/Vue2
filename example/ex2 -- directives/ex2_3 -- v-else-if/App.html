<!DOCTYPE html5>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
  <div style="text-align: center; 
  width: 600px;"> 
    
  <h1 style="color: green;"> 
      測試 v-else-if 
  </h1> 
</div> 

<div id="canvas" style= 
  "border:1px solid #000000; 
  width: 600px;height: 200px;"> 

  <div id="app"> 
      <h2 v-if="data"> 
          if is executed 
      </h2> 
      <h2 v-else-if="!data"> 
          else-if is executed 
      </h2> 
  </div> 
</div> 

<script> 
  var app = new Vue({ 
      el: '#app', 
      data: { 
          data: false 
      } 
  }) 
</script> 
</body> 

</html>     
</body>

</html>
