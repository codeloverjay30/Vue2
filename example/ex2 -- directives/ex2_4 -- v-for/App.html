<!DOCTYPE html5>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h2>測試 v-for 遍歷、讀取陣列</h2>
        <ul>
          <li v-for="(p, index) in persons" :key="index">
            {{ index }} --- {{p.name}} --- {{p.age}}
            --<button @click="deleteP(index)">Delete</button>
            -- <button @click="updateP(index, {name:'Fanny', age: 25})">Update</button>
          </li>
        </ul>
        -- <button @click="addP({name:'Tom', age: 3})">Add</button>
    
        <h2>測試 v-for 遍歷、讀取物件</h2>
        <ul>
          <li v-for="(value, key) in persons[1]" :key="key">{{value}} -- {{key}}</li>
        </ul>
      </div>
<script>
    const vm = new Vue({
      el: '#app',
      data: {
        persons: [{
            name: 'Ayda',
            age: 18
          },
          {
            name: 'Tracy',
            age: 24
          },
          {
            name: 'Philippe',
            age: 42
          }
        ]
      },
      methods: {
        deleteP(index) {
          this.persons.splice(index, 1)
        },
        updateP(index, newP) {
          // this.persons[index] = newP 
          // 這樣的做法因為無原生陣列函式，所以在vue 不會起作用，也不會自動更新頁面
          // console.log(this.persons[index], newP)
          this.persons.splice(index, 1, newP)
        },
        addP(newP) {
          this.persons.push(newP)
        }
      },
    })
</script>
</body>

</html>
