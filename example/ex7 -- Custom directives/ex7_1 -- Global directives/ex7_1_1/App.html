<!DOCTYPE html5>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
    <div id="app">
      <h2>測試 custom global directives</h2>
      <div id="app1">
        <p v-upper-text="msg1"></p>
        <p v-lower-text="msg1"></p>
      </div>
      <div id="app2">
        <p v-upper-text="msg2"></p>
        <p v-lower-text="msg2"></p>
      </div>
      <div id="app3">
        <input v-focus>
      </div>
    </div>
<script>
      // 自定義全局指令
      // el : 指令屬性的所在標籤物件
      // binding : 包含指令相關訊息的資料物件
      Vue.directive('upper-text', function(el, binding) {
        el.innerHTML = binding.value.toUpperCase();
      });

      new Vue({
        el: '#app1',
        data: {
          msg1: 'Hello Paris'
        },
        // 自定義局部指令，只會對`#app1`起作用
        directives: {
          'upper-text'(el, binding) {
            el.innerHTML = binding.value.toLowerCase();
          }
        }
      });

      new Vue({
        el: '#app2',
        data: {
          msg2: 'Hello Taipei'
        }
      });
      
    // 註冊一個全局自定義指令 `v-focus`
    Vue.directive('focus', {
      // 當被綁定的元素插入到 DOM 中時……
      inserted: function (el) {
        // 聚焦元素
        el.focus()
      }
    })
    // 如果想註冊局部指令，組件中也接受一個 directives 的選項：
    new Vue({
            el:'#app3',
            directives: {
            focus: {
            // 指令的定義
              inserted: function (el) {
              el.focus()
            }
          }
        }
    });
</script>
</body>

</html>
