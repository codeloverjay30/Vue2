<!DOCTYPE html5>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>
<body>
    <div id="app">
      <h2>測試 custom local directives</h2>
      <div id="app1">
        <p v-upper-text="msg1"></p>
        <p v-lower-text="msg1"></p>
      </div>
      <div id="app2">
        <p v-upper-text="msg2"></p>
        <p v-lower-text="msg2"></p>
      </div>
      <div id="app3">
        <input v-focus>
      </div>
    </div>
<script>
    // 註冊一個全局自定義指令 `v-focus`
    Vue.directive('focus', {
      // 當被綁定的元素插入到 DOM 中時……
      inserted: function (el) {
        // 聚焦元素
        el.focus()
      }
    })
    // 如果想註冊局部指令，組件中也接受一個 directives 的選項：
    new Vue({
            el:'#app3',
            directives : {
              'my-directive' : {
                  bind (el, binding) {
                    el.innerHTML = binding.value.toUpperCase()
                  }
              },
              // 也可以寫成
              'my-directive'(el, binding) {
                el.innerHTML = binding.value.toUpperCase()
            }
      }
    });
</script>
</body>

</html>
